name: Build and test
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r requirements-dev.txt
      - run: python scripts/setup.py --test
      - name: Build the frontend and backend containers
        run: docker compose --env-file .env.test -f compose.test.yaml up --build -d
      - run: python scripts/wait_ready.py
      - name: Check real HTTP requests and database writes
        run: python -m pytest tests integration -q --junitxml=test-results/results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: test-results/*.xml
      - name: Show logs on failure
        if: failure()
        run: docker compose --env-file .env.test -f compose.test.yaml logs --tail=80
      - name: Stop the test stack
        if: always()
        run: docker compose --env-file .env.test -f compose.test.yaml down
